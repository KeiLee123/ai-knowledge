services:
  changedetection:
    image: dgtlmoon/changedetection.io@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
    container_name: jason-os-changedetection-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - changedetection_staging_data:/datastore
    environment:
      TZ: Asia/Hong_Kong
    labels:
      com.jasonos.environment: staging
      com.jasonos.purpose: source-change-detect
      com.jasonos.managed-by: git
    networks:
      - changedetection_staging_net

volumes:
  changedetection_staging_data:
    name: jason-os-changedetection-staging-data

networks:
  changedetection_staging_net:
    name: jason-os-changedetection-staging-net
    driver: bridge
