legislation_registry_version: 2
defaults:
  jurisdiction: HK
  source_of_truth: HKeL
  check_frequency: daily
  bootstrap:
    download_current_version: true
    build_baseline: true
  change_detection:
    compare_version_date: true
    compare_sha256: true
    compare_text: true
  analysis:
    use_llm_only_on_change: true
    compare_changed_provisions_only: true
  lifecycle:
    auto_supersede: false
    require_human_review: true
  source_publisher: Department of Justice
