name: M10B-2C Offline Retrieval Comparison

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b2c_offline_comparison_v1.py'
      - 'test_m10b2c_offline_comparison_v1.py'
      - 'docs/m10b2c_offline_comparison_v1.md'
      - '.github/workflows/m10b2c_offline_comparison.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b2c_offline_comparison_v1.py'
      - 'test_m10b2c_offline_comparison_v1.py'
      - '.github/workflows/m10b2c_offline_comparison.yml'

permissions:
  contents: read

jobs:
  compare-offline-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF fixture dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Syntax and module import restrictions
        run: |
          python -m py_compile m10b2c_offline_comparison_v1.py test_m10b2c_offline_comparison_v1.py
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("m10b2c_offline_comparison_v1.py")
          root = ast.parse(path.read_text(encoding="utf-8"))
          imports = set()
          for node in ast.walk(root):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module)
          allowed = {
              "hashlib", "json",
              "m10b2a_gold_cases_v1",
              "m10b2b0_offline_semantic_v1",
          }
          assert imports == allowed, imports
          forbidden_calls = {"open", "eval", "exec", "__import__"}
          for node in ast.walk(root):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  assert node.func.id not in forbidden_calls, node.func.id
          print("Pure offline composition import and IO guard: PASS")
          PY
      - name: M10A offline regression
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 contract audit
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 candidate regression
        run: python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical regression
        run: python test_m10b2a_candidate_lexical_v1.py
      - name: M10B-2A synthetic Gold regression
        run: python test_m10b2a_gold_cases_v1.py
      - name: M10B-2B-0 offline semantic regression
        run: python test_m10b2b0_offline_semantic_v1.py
      - name: M10B-2B-1 endpoint audit offline regression
        run: python test_m10b2b1_readonly_endpoint_audit_v1.py
      - name: M10B-2C offline comparison
        run: python test_m10b2c_offline_comparison_v1.py
