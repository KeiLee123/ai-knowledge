name: M10B-2H Offline Silver Generator and Review Queue

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b2h_offline_silver_generation_v1.py'
      - 'test_m10b2h_offline_silver_generation_v1.py'
      - 'docs/m10b2h_offline_silver_generation_v1.md'
      - '.github/workflows/m10b2h_offline_silver_generation.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b2h_offline_silver_generation_v1.py'
      - 'test_m10b2h_offline_silver_generation_v1.py'
      - '.github/workflows/m10b2h_offline_silver_generation.yml'

permissions:
  contents: read

jobs:
  offline-silver-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic PDF dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Pure module AST/syntax guard
        run: |
          python -m py_compile m10b2h_offline_silver_generation_v1.py test_m10b2h_offline_silver_generation_v1.py
          python - <<'PY'
          import ast
          from pathlib import Path
          t = ast.parse(Path('m10b2h_offline_silver_generation_v1.py').read_text(encoding='utf-8'))
          imports = set()
          for node in ast.walk(t):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module)
          assert imports == {'hashlib', 'json', 'm10b2f_offline_silver_evidence_v1'}, imports
          for node in ast.walk(t):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  assert node.func.id not in {'open','eval','exec','__import__'}
          print('M10B-2H pure in-memory module guard: PASS')
          PY
      - name: M10A intake
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 safety
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 isolated candidate
        run: python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical
        run: python test_m10b2a_candidate_lexical_v1.py
      - name: M10B-2A synthetic Gold
        run: python test_m10b2a_gold_cases_v1.py
      - name: M10B-2B-0 synthetic vectors
        run: python test_m10b2b0_offline_semantic_v1.py
      - name: M10B-2B-1 offline endpoint audit contract
        run: python test_m10b2b1_readonly_endpoint_audit_v1.py
      - name: M10B-2C offline comparison
        run: python test_m10b2c_offline_comparison_v1.py
      - name: M10B-2D Markdown report
        run: python test_m10b2d_offline_report_v1.py
      - name: M10B-2E ranking
        run: python test_m10b2e_offline_ranking_diagnostics_v1.py
      - name: M10B-2F Silver evidence
        run: python test_m10b2f_offline_silver_evidence_v1.py
      - name: M10B-2G APP149 adapter synthetic
        run: python test_m10b2g_app149_readonly_silver_pilot_v1.py
      - name: M10B-2H generated Silver and review queue
        run: python test_m10b2h_offline_silver_generation_v1.py
