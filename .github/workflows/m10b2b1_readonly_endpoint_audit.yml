name: M10B-2B-1 Read-only Endpoint Audit

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'ops/audit_embedding_endpoint_staging_v1.py'
      - 'test_m10b2b1_readonly_endpoint_audit_v1.py'
      - 'docs/m10b2b1_readonly_endpoint_audit_v1.md'
      - '.github/workflows/m10b2b1_readonly_endpoint_audit.yml'
  push:
    branches:
      - staging
    paths:
      - 'ops/audit_embedding_endpoint_staging_v1.py'
      - 'test_m10b2b1_readonly_endpoint_audit_v1.py'
      - '.github/workflows/m10b2b1_readonly_endpoint_audit.yml'

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile audit script and regression
        run: python -m py_compile ops/audit_embedding_endpoint_staging_v1.py test_m10b2b1_readonly_endpoint_audit_v1.py
      - name: M10B-2B-1 read-only audit regression
        run: python test_m10b2b1_readonly_endpoint_audit_v1.py
      - name: Verify no unsafe network or model calls in audit module
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("ops/audit_embedding_endpoint_staging_v1.py").read_text()
          forbidden = ["urllib.request", "socket.connect", "requests.get(",
                       "requests.post(", "Config.Env", "/proc/", "docker exec",
                       "systemctl restart", "systemctl start", "open("]
          for needle in forbidden:
              assert needle not in src, needle
          print("No unsafe audit code patterns: PASS")
          PY
      - name: M10A regression
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 contract audit
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 synthetic regression
        run: |
          python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
          python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical regression
        run: python test_m10b2a_candidate_lexical_v1.py
      - name: M10B-2A synthetic Gold regression
        run: python test_m10b2a_gold_cases_v1.py
      - name: M10B-2B-0 offline semantic regression
        run: python test_m10b2b0_offline_semantic_v1.py
