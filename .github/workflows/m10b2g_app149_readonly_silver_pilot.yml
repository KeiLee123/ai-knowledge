name: M10B-2G APP149 Read-only Silver Pilot

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b2g_app149_readonly_silver_pilot_v1.py'
      - 'test_m10b2g_app149_readonly_silver_pilot_v1.py'
      - 'docs/m10b2g_app149_readonly_silver_pilot_v1.md'
      - '.github/workflows/m10b2g_app149_readonly_silver_pilot.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b2g_app149_readonly_silver_pilot_v1.py'
      - 'test_m10b2g_app149_readonly_silver_pilot_v1.py'
      - '.github/workflows/m10b2g_app149_readonly_silver_pilot.yml'

permissions:
  contents: read

jobs:
  app149-readonly-silver-synthetic-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic PDF fixture dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Syntax and pure-adapter import guard
        run: |
          python -m py_compile m10b2g_app149_readonly_silver_pilot_v1.py test_m10b2g_app149_readonly_silver_pilot_v1.py
          python - <<'PY'
          import ast
          from pathlib import Path
          code = Path("m10b2g_app149_readonly_silver_pilot_v1.py").read_text(encoding="utf-8")
          tree = ast.parse(code)
          imports = set()
          for n in ast.walk(tree):
              if isinstance(n, ast.Import):
                  imports.update(a.name for a in n.names)
              elif isinstance(n, ast.ImportFrom):
                  imports.add(n.module)
          assert imports == {"hashlib", "m10b2f_offline_silver_evidence_v1"}, imports
          for n in ast.walk(tree):
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Name):
                  assert n.func.id not in {"open", "eval", "exec", "__import__"}
          assert "https://" not in code and "rclone" not in code
          print("M10B-2G pure in-memory adapter guard: PASS")
          PY
      - name: M10A offline intake
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 safety contract
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 isolated candidate
        run: python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical
        run: python test_m10b2a_candidate_lexical_v1.py
      - name: M10B-2A synthetic Gold
        run: python test_m10b2a_gold_cases_v1.py
      - name: M10B-2B-0 synthetic vector
        run: python test_m10b2b0_offline_semantic_v1.py
      - name: M10B-2B-1 offline audit
        run: python test_m10b2b1_readonly_endpoint_audit_v1.py
      - name: M10B-2C comparison
        run: python test_m10b2c_offline_comparison_v1.py
      - name: M10B-2D report
        run: python test_m10b2d_offline_report_v1.py
      - name: M10B-2E ranking
        run: python test_m10b2e_offline_ranking_diagnostics_v1.py
      - name: M10B-2F silver verifier
        run: python test_m10b2f_offline_silver_evidence_v1.py
      - name: M10B-2G APP149 adapter synthetic tests only
        run: python test_m10b2g_app149_readonly_silver_pilot_v1.py
