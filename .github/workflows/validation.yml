      - name: M11 VPS read-only acceptance runner syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/m11_pr101_vps_staging_readonly_acceptance.sh
          python - <<'PY'
          from pathlib import Path
          text = Path("scripts/m11_pr101_vps_staging_readonly_acceptance.sh").read_text()
          for required in ("EXPECTED_PR_HEAD", "m11_automated_quality_probe_v1.py",
                           "include_retrieval=True", "M11_PR101_STAGING_WORKTREE: CLEAN",
                           "http://127.0.0.1:8088/embed"):
              assert required in text, required
          inline_python = text.split("<<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
          compile(inline_python, "m11_vps_acceptance_inline.py", "exec")
          import os
          import subprocess
          import tempfile
          guard = 'test "$(git -C "$ROOT" rev-parse --is-inside-work-tree)" = "true"'
          assert guard in text, "missing_worktree_compatible_guard"
          assert 'test -d "$ROOT/.git"' not in text, "obsolete_git_directory_guard"
          with tempfile.TemporaryDirectory() as temp:
              source = Path(temp) / "regular"
              linked = Path(temp) / "linked"
              subprocess.run(["git", "init", "-q", str(source)], check=True)
              subprocess.run(["git", "-C", str(source), "-c", "user.name=M11CI",
                              "-c", "user.email=m11ci@example.invalid", "commit",
                              "--allow-empty", "-qm", "fixture"], check=True)
              subprocess.run(["git", "-C", str(source), "worktree", "add",
                              "--detach", "-q", str(linked)], check=True)
              assert (source / ".git").is_dir()
              assert (linked / ".git").is_file()
              for root in (source, linked):
                  env = dict(os.environ, ROOT=str(root))
                  subprocess.run(["bash", "-c", guard], check=True, env=env)
          print("M11_VPS_WORKTREE_REGRESSION: PASS")
          print("M11_VPS_RUNNER_STATIC_CONTRACT: PASS")
          PY

      - name: M11 real pinned APP149 read-only report (PR 101 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 101
        shell: bash
        run: |
          set -euo pipefail
          TEST_TMP="$(mktemp -d)"
          trap 'rm -rf "$TEST_TMP"' EXIT
          DOC_URL="https://www.bd.gov.hk/doc/en/resources/codes-and-references/practice-notes-and-circular-letters/pnap/APP/APP149.pdf"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 60 --output "$TEST_TMP/APP149.pdf" "$DOC_URL"
          EXPECTED="a5b4d5a1af5f4a32b43973db33d95436f9390e8e2da77747ee666015077bb1a8"
          ACTUAL="$(sha256sum "$TEST_TMP/APP149.pdf" | cut -d' ' -f1)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "M11_REAL_PDF_SOURCE_MISMATCH: current public file is not pinned Drive-approved copy"
            exit 3
          fi
          PYTHONDONTWRITEBYTECODE=1 python m11_automated_quality_probe_v1.py --pdf "$TEST_TMP/APP149.pdf" > "$TEST_TMP/report.json"
          python - "$TEST_TMP/report.json" <<'PY'
          import json, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8")
          # Strict machine-readable contract: no prefix scanning or repair.
          d = json.loads(raw)
          print("M11_REAL_APP149_STRICT_JSON_STDOUT: PASS")
          assert d["source_id"] == "BD_PNAP_APP149"
          assert d["document"]["physical_pages"] == 5
          assert d["evidence_verifier"]["case_count"] == 5
          assert d["evidence_verifier"]["official_gold_approved"] == 0
          assert d["human_gold_approved"] == 0
          assert d["answer_correctness_accuracy"] == "UNKNOWN_NOT_MEASURED"
          assert d["anki_card_accuracy"] == "UNKNOWN_NOT_MEASURED"
          assert d["external_ai_called"] is False
          assert d["production_write"] is False
          assert d["shared_db_write"] is False
          assert d["canonical_drive_write"] is False
          assert d["retrieval"] is None
          print("M11_REAL_APP149_READONLY_REPORT: PASS")
          print("source_sha256:", d["document"]["source_sha256"])
          print("page_count:", d["document"]["physical_pages"])
          print("silver_counts:", json.dumps(d["evidence_verifier"], ensure_ascii=False, sort_keys=True))
          print("answer_correctness_accuracy:", d["answer_correctness_accuracy"])
          PY

