name: Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tracked Python files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Reject tracked secret-like files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|credentials|secret'; then
            echo "Secret-like filename is tracked by Git."
            exit 1
          fi

      - name: Verify tracked-file policy
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -ci --exclude-standard | grep -q .; then
            echo "Tracked files are now excluded by .gitignore:"
            git ls-files -ci --exclude-standard
            exit 1
          fi
