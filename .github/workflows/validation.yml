name: Validation

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Import smoke test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pymupdf
          import docx
          import yaml

          print("pymupdf", getattr(pymupdf, "__version__", "unknown"))
          print("python-docx", getattr(docx, "__version__", "unknown"))
          print("PyYAML", getattr(yaml, "__version__", "unknown"))
          PY

      - name: Compile tracked Python files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Changedetection staging deployment contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_changedetection_deployment_v1.py

      - name: VPS storage audit contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_vps_storage_guard_v1.py

      - name: Source Registry v1 contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_source_registry_v1.py

      - name: Source Monitor baseline v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_source_monitor_baseline_v1.py

      - name: PNAP staging writer v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_write_pnap_staging_v1.py

      - name: Canonical Promotion v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_promote_pnap_canonical_v1.py

      - name: Canonical Ingestion v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_ingest_canonical_staging_v1.py

      - name: Canonical Text Ingestion v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_ingest_canonical_text_staging_v1.py

      - name: Canonical Text Staging Milestone validator test
        shell: bash
        run: |
          set -euo pipefail
          python test_validate_canonical_text_staging_milestone_v1.py

      - name: Official Source Processing Pipeline v1 contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_process_official_source_staging_v1.py

      - name: Version Qualification Policy v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_version_qualification_policy_v1.py

      - name: Version Signal Extractor v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_version_signal_extractor_v1.py

      - name: Version Snapshot Store v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_version_snapshot_store_v1.py

      - name: Official Source Monitor Integration v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_monitor_official_source_v1.py

      - name: M8 Source Monitor scheduler contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_source_monitor_scheduler_v1.py

      - name: M9B Multi-source monitor orchestration contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_source_monitor_batch_v1.py

      - name: M9D Source Monitor scheduler cutover contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_source_monitor_cutover_v1.py

      - name: Beta Gate 1 M9 to versioned Drive Staging integration contract
        shell: bash
        run: |
          set -euo pipefail
          python test_beta_stage_monitor_candidate_v1.py

      - name: Private Beta Staging Q&A source and citation safety contract
        shell: bash
        run: |
          set -euo pipefail
          python test_beta_ask_staging_v1.py

      - name: Private Beta loopback UI token, source and feedback security contract
        shell: bash
        run: |
          set -euo pipefail
          python test_beta_private_ui_staging_v1.py

      - name: Hermes Staging evidence JSON contract and refusal test
        shell: bash
        run: |
          set -euo pipefail
          python test_beta_hermes_evidence_v1.py

      - name: Hermes optional MCP SDK stdio protocol contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-hermes-mcp.txt
          python test_beta_hermes_mcp_stdio_v1.py

      - name: Hermes trusted snapshot exporter and unprivileged MCP reader
        shell: bash
        run: |
          set -euo pipefail
          python test_beta_hermes_snapshot_v1.py

      - name: Hermes live SDK v2.0.0 compatibility (isolated CI environment)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'mcp==2.0.0'
          python test_beta_hermes_mcp_stdio_v1.py
          python test_beta_hermes_snapshot_v1.py

      - name: Hermes Gate 3D-B canary install guarded script contract (offline)
        shell: bash
        run: |
          set -euo pipefail
          python test_hermes_gate3d_canary_script_v1.py

      - name: Hermes Gate 3D-C isolated nonroot Chat evidence fingerprint (offline)
        shell: bash
        run: |
          set -euo pipefail
          python test_hermes_gate3dc_isolated_chat_v1.py

      - name: Hermes Gate 3D-C MCP discovery diagnostics, no provider calls
        shell: bash
        run: |
          set -euo pipefail
          python test_hermes_gate3dc_mcp_discovery_v1.py

      - name: Generic Production Promotion v2 contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_generic_production_promotion_v2.py

      - name: Production Promotion Guard v1 test
        shell: bash
        run: |
          set -euo pipefail
          python test_production_promotion_guard_v1.py

      - name: Production Promotion P2 contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_promote_canonical_text_production_v1.py

      - name: Production Recovery P3 contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_recover_canonical_text_production_v1.py

      - name: Production Post-write Validator P4 contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_validate_canonical_text_production_v1.py

      - name: Production Release Packaging contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_production_release_packaging_v1.py

      - name: Production Write Readiness contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_validate_production_write_readiness_v1.py

      - name: Production Canonical Text Writer contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_write_canonical_text_production_v1.py

      - name: Multimodal ingestion contract test
        shell: bash
        run: |
          set -euo pipefail
          python test_multimodal_ingestion_contract_v2.py

      - name: Source page provenance test
        shell: bash
        run: |
          set -euo pipefail
          python test_attach_source_pages_v2.py

      - name: V2 orchestrator source-page integration test
        shell: bash
        run: |
          set -euo pipefail
          python test_orchestrate_source_pages_v2.py

      - name: Multimodal canary isolation guard test
        shell: bash
        run: |
          set -euo pipefail
          python test_multimodal_canary_guard_v2.py

      - name: Prepared canary writer guard test
        shell: bash
        run: |
          set -euo pipefail
          python test_write_prepared_canary_v2.py

      - name: Staging retrieval validator test
        shell: bash
        run: |
          set -euo pipefail
          python test_validate_staging_retrieval_v2.py

      - name: Visual retrieval relevance prompt test
        shell: bash
        run: |
          set -euo pipefail
          python test_visual_retrieval_prompt_v2.py

      - name: SR-G review fallback regression test
        shell: bash
        run: |
          set -euo pipefail
          python test_sync_anki_reviews_v1.py

      - name: SR-H analytics self-test
        shell: bash
        run: |
          set -euo pipefail
          python analyze_anki_knowledge_v1.py --self-test

      - name: SR-I periodic assessment self-test
        shell: bash
        run: |
          set -euo pipefail
          python assess_knowledge_periodic_v1.py --self-test

      - name: SR-J automated reporting self-test
        shell: bash
        run: |
          set -euo pipefail
          python run_knowledge_reporting_v1.py --self-test

      - name: Reject tracked secret-like files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|credentials|secret'; then
            echo "Secret-like filename is tracked by Git."
            exit 1
          fi

      - name: Verify tracked-file policy
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -ci --exclude-standard | grep -q .; then
            echo "Tracked files are now excluded by .gitignore:"
            git ls-files -ci --exclude-standard
            exit 1
          fi