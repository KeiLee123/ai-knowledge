name: M10B-2A Gold Case Contract (Synthetic)

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b2a_gold_cases_v1.py'
      - 'test_m10b2a_gold_cases_v1.py'
      - 'tests/fixtures/m10b2a_gold_synthetic_v1.json'
      - 'm10b2a_candidate_lexical_v1.py'
      - 'build_multimodal_chunks_v2.py'
      - 'extract_document_v2.py'
      - '.github/workflows/m10b2a_gold_cases.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b2a_gold_cases_v1.py'
      - 'test_m10b2a_gold_cases_v1.py'
      - 'tests/fixtures/m10b2a_gold_synthetic_v1.json'
      - '.github/workflows/m10b2a_gold_cases.yml'

permissions:
  contents: read

jobs:
  synthetic-gold-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local PDF parser dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Check Python syntax
        run: python -m py_compile m10b2a_gold_cases_v1.py test_m10b2a_gold_cases_v1.py
      - name: M10A regression
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 contract audit
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 synthetic regression
        run: python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical regression
        run: python test_m10b2a_candidate_lexical_v1.py
      - name: Synthetic-only Gold Case regression
        run: python test_m10b2a_gold_cases_v1.py
