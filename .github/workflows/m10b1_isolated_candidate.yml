name: M10B-1 Isolated Candidate Validation

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b1_isolated_candidate_v1.py'
      - 'test_m10b1_isolated_candidate_v1.py'
      - 'm10_candidate_intake_v1.py'
      - 'source_registry_v1.yaml'
      - 'extract_document_v2.py'
      - 'route_document_v2.py'
      - 'version_signal_extractor_v1.py'
      - 'version_qualification_policy_v1.py'
      - '.github/workflows/m10b1_isolated_candidate.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b1_isolated_candidate_v1.py'
      - 'test_m10b1_isolated_candidate_v1.py'
      - '.github/workflows/m10b1_isolated_candidate.yml'

permissions:
  contents: read

jobs:
  synthetic-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser and registry dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Syntax checks
        run: python -m py_compile m10b1_isolated_candidate_v1.py test_m10b1_isolated_candidate_v1.py
      - name: M10A intake regression
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 contract regression
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 isolated synthetic PDF regression
        run: python test_m10b1_isolated_candidate_v1.py
