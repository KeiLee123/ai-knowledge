name: M10B-2I APP149 Read-only Generated Silver Pilot

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b2i_app149_readonly_generated_silver_v1.py'
      - 'test_m10b2i_app149_readonly_generated_silver_v1.py'
      - 'docs/m10b2i_app149_readonly_generated_silver_v1.md'
      - '.github/workflows/m10b2i_app149_readonly_generated_silver.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b2i_app149_readonly_generated_silver_v1.py'
      - 'test_m10b2i_app149_readonly_generated_silver_v1.py'
      - '.github/workflows/m10b2i_app149_readonly_generated_silver.yml'

permissions:
  contents: read

jobs:
  app149-generated-silver-synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline PDF regression dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Syntax and in-memory-only module import guard
        run: |
          python -m py_compile m10b2i_app149_readonly_generated_silver_v1.py test_m10b2i_app149_readonly_generated_silver_v1.py
          python - <<'PY'
          import ast
          from pathlib import Path
          content = Path('m10b2i_app149_readonly_generated_silver_v1.py').read_text(encoding='utf-8')
          tree = ast.parse(content)
          names = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  names.update(item.name for item in node.names)
              elif isinstance(node, ast.ImportFrom):
                  names.add(node.module)
          assert names == {'hashlib', 'json', 'm10b2f_offline_silver_evidence_v1', 'm10b2g_app149_readonly_silver_pilot_v1', 'm10b2h_offline_silver_generation_v1'}, names
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  assert node.func.id not in {'open', 'eval', 'exec', '__import__'}
          assert 'rclone' not in content and 'https://' not in content
          print('M10B-2I pure in-memory adapter guard: PASS')
          PY
      - name: M10A
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1
        run: python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical
        run: python test_m10b2a_candidate_lexical_v1.py
      - name: M10B-2A synthetic Gold
        run: python test_m10b2a_gold_cases_v1.py
      - name: M10B-2B-0
        run: python test_m10b2b0_offline_semantic_v1.py
      - name: M10B-2B-1
        run: python test_m10b2b1_readonly_endpoint_audit_v1.py
      - name: M10B-2C
        run: python test_m10b2c_offline_comparison_v1.py
      - name: M10B-2D
        run: python test_m10b2d_offline_report_v1.py
      - name: M10B-2E
        run: python test_m10b2e_offline_ranking_diagnostics_v1.py
      - name: M10B-2F
        run: python test_m10b2f_offline_silver_evidence_v1.py
      - name: M10B-2G
        run: python test_m10b2g_app149_readonly_silver_pilot_v1.py
      - name: M10B-2H
        run: python test_m10b2h_offline_silver_generation_v1.py
      - name: M10B-2I
        run: python test_m10b2i_app149_readonly_generated_silver_v1.py
