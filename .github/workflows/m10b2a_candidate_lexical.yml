name: M10B-2A Candidate-only Lexical Retrieval

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'm10b2a_candidate_lexical_v1.py'
      - 'test_m10b2a_candidate_lexical_v1.py'
      - 'm10b1_isolated_candidate_v1.py'
      - 'build_multimodal_chunks_v2.py'
      - 'extract_document_v2.py'
      - 'route_document_v2.py'
      - 'source_registry_v1.yaml'
      - '.github/workflows/m10b2a_candidate_lexical.yml'
  push:
    branches:
      - staging
    paths:
      - 'm10b2a_candidate_lexical_v1.py'
      - 'test_m10b2a_candidate_lexical_v1.py'
      - '.github/workflows/m10b2a_candidate_lexical.yml'

permissions:
  contents: read

jobs:
  isolated-lexical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline parser dependencies
        run: python -m pip install PyMuPDF==1.26.6 PyYAML==6.0.3
      - name: Compile
        run: python -m py_compile m10b2a_candidate_lexical_v1.py test_m10b2a_candidate_lexical_v1.py
      - name: M10A regression
        run: python test_m10_candidate_intake_v1.py
      - name: M10B-0 contract audit
        run: python test_m10b0_candidate_contract_v1.py
      - name: M10B-1 synthetic regression
        run: python test_m10b1_isolated_candidate_v1.py
      - name: M10B-2A lexical and provenance regression
        run: python test_m10b2a_candidate_lexical_v1.py
